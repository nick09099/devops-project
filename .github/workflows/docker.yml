name: CI Pipeline

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Build Docker images
      run: docker-compose build

    - name: Run containers
      run: docker-compose up -d

    - name: Test API
      run: curl http://localhost:8080/api/users
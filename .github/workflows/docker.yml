name: CI Pipeline

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Build and Run Docker containers
      run: docker compose up --build -d

    - name: Test API
      run: curl http://localhost:8080/api/users
name: CI Pipeline

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Build and Run Docker containers
      run: docker compose up --build -d

    - name: Show logs
      run: docker compose logs

    - name: Wait for app
      run: |
        for i in {1..30}; do
          if curl -f http://localhost:8080/api/users; then
            echo "App is ready!"
            exit 0
          fi
          echo "Waiting..."
          sleep 5
        done
        docker compose logs
        exit 1
    
    - name: Login to Docker Hub
      run: echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin    
      
    # BACKEND
    - name: Build backend image
      run: |
        docker build -t ${{ secrets.DOCKER_USERNAME }}/devops-backend:latest \
                     -t ${{ secrets.DOCKER_USERNAME }}/devops-backend:${{ github.sha }} \
                     ./backend

    - name: Push backend image
      run: |
        docker push ${{ secrets.DOCKER_USERNAME }}/devops-backend:latest
        docker push ${{ secrets.DOCKER_USERNAME }}/devops-backend:${{ github.sha }}

    # FRONTEND
    - name: Build frontend image
      run: |
        docker build -t ${{ secrets.DOCKER_USERNAME }}/devops-frontend:latest \
                     -t ${{ secrets.DOCKER_USERNAME }}/devops-frontend:${{ github.sha }} \
                     ./frontend

    - name: Push frontend image
      run: |
        docker push ${{ secrets.DOCKER_USERNAME }}/devops-frontend:latest
        docker push ${{ secrets.DOCKER_USERNAME }}/devops-frontend:${{ github.sha }}